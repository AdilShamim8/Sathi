<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sathi — সাথী</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F6F4EE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1c1a1a;
    }
    .splash {
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #1c1a1a;
      color: #38c878;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      box-shadow: 0 8px 24px rgba(28,26,26,0.15);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">৳</div>
    <h2 style="margin: 0 0 6px 0;">Sathi <span style="color: #2ba55d;">সাথী</span></h2>
    <p style="margin: 0; color: #767267; font-size: 13px;">আর্থিক স্বাধীনতা সহকারী</p>
  </div>
</body>
</html>
