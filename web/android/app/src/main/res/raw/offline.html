<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sathi — reconnecting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    background: #F6F4EE;
    color: #1C1A1A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { text-align: center; max-width: 420px; width: 100%; }
  .logo {
    width: 72px; height: 72px;
    background: #1C1A1A;
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 700;
    color: #06D6A0;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 14px; color: #6B6660; margin-top: 4px; }
  .msg {
    margin-top: 22px;
    font-size: 15px;
    line-height: 1.55;
    color: #3A3631;
  }
  .bn { display: block; margin-top: 6px; color: #6B6660; font-size: 14px; }
  .reason {
    margin-top: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #A03E3E;
    background: rgba(160, 62, 62, 0.07);
    border-radius: 8px;
    padding: 8px 12px;
    word-break: break-all;
    display: inline-block;
  }
  .btn {
    margin-top: 26px;
    width: 100%;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 600;
    color: #FFFFFF;
    background: #1C1A1A;
    border: none;
    border-radius: 14px;
    cursor: pointer;
  }
  .btn:active { opacity: 0.85; }
  .count { font-size: 13px; color: #6B6660; margin-top: 14px; }
  .dots { color: #06D6A0; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">৳</div>
    <h1>Sathi <span style="font-weight:400">সাথী</span></h1>
    <div class="sub">Your Financial Copilot</div>

    <p class="msg">
      Can&rsquo;t reach the app right now.
      <span class="bn">এখন সার্ভারে পৌঁছানো যাচ্ছে না।</span>
    </p>

    <div class="reason" id="reason">__REASON__</div>

    <button class="btn" onclick="retry()">Try Again &middot; আবার চেষ্টা করুন</button>

    <div class="count">
      Retrying automatically in <span class="dots"><span id="cd">8</span>s</span>&hellip;<br>
      Please check your internet connection &middot; ইন্টারনেট সংযোগ পরীক্ষা করুন
    </div>
  </div>

<script>
  var APP_URL = "https://sathi-pied.vercel.app/";
  var seconds = 8;
  var el = document.getElementById("cd");

  function retry() { window.location.replace(APP_URL); }

  var timer = setInterval(function () {
    seconds--;
    if (el) { el.textContent = seconds > 0 ? seconds : 0; }
    if (seconds <= 0) { clearInterval(timer); retry(); }
  }, 1000);
</script>
</body>
</html>
