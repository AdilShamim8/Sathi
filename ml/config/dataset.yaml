# Dataset configuration. "Today" for the whole prototype is as_of_date (ADR-10):
# the last day of the synthetic window. Real wall-clock time is never used.
dataset:
  seed: 20261003            # master seed; same seed + config => identical data
  as_of_date: "2026-09-30"  # ASSUMPTION: synthetic window ends here
  start_date: "2025-10-01"  # 12 months of history
  n_users: 2000             # 5 personas x 400 users (balanced)
  timezone: "Asia/Dhaka"
  # Drifted test cohort (data/drifted/): shifted parameters, never trained
  # or tuned on. Answers "did the model just learn the generator?".
  drifted_cohort:
    users_per_persona: 100
    income_day_shift: 4       # e.g. wage day 7 -> 11
    volatility_mult: 2.0      # overtime / daily-earnings / remittance-gap spread
    shock_mult: 2.0           # shock frequency
  splits:
    # User-level split: whole users assigned to train/val/test by id.
    test_user_share: 0.15   # frozen held-out test users (never trained/tuned on)
    val_user_share: 0.15    # validation + calibration users (tuning, conformal)
    # Time-level split inside train users: last `time_test_days` are the
    # time-based hold-out for forecast evaluation.
    time_test_days: 60
    time_val_days: 30
