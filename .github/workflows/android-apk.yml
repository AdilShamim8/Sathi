name: Build Android APK & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build App Shell & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The app shell is a thin Capacitor wrapper that loads the deployed
      # Next.js app (server-rendered UI + API routes). No static export is
      # needed: web/capacitor.config.json points at the deployment URL.
      - name: Install Capacitor packages in web
        working-directory: web
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Ensure Android webDir assets exist
        working-directory: web
        run: |
          mkdir -p public
          if [ ! -f public/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Sathi</title></head><body><div id="root"></div></body></html>' > public/index.html
          fi

      - name: Sync Capacitor Android
        working-directory: web
        run: npx cap sync android

      - name: Set gradlew executable permission
        run: chmod +x web/android/gradlew

      - name: Build Android Debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p apk-output
          cp web/android/app/build/outputs/apk/debug/app-debug.apk apk-output/sathi-v6.0.0-debug.apk
          ls -la apk-output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sathi-android-apk
          path: apk-output/sathi-v6.0.0-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v6.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Sathi Release {0}', github.ref_name) || 'Sathi App Release v6.0.0 (Latest APK)' }}
          files: apk-output/sathi-v6.0.0-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
