name: Build Android APK & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build App Shell & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The app shell is a thin Capacitor wrapper that loads the deployed
      # Next.js app (web/capacitor.config.json -> server.url). No static
      # export is needed. When the backend is unreachable, the app falls
      # back to the offline demo page bundled in res/raw/offline.html.
      - name: Install Capacitor packages in web
        working-directory: web
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Ensure Android webDir assets exist
        working-directory: web
        run: |
          mkdir -p public
          if [ ! -f public/index.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Sathi</title></head><body><div id="root"></div></body></html>' > public/index.html
          fi

      - name: Sync Capacitor Android
        working-directory: web
        run: npx cap sync android

      - name: Set gradlew executable permission
        run: chmod +x web/android/gradlew

      - name: Restore release signing key
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > sathi-release.keystore
            echo "stable release keystore restored"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - generating an ephemeral key (updates will need a reinstall)"
            keytool -genkeypair -keystore sathi-release.keystore -alias sathi \
              -keyalg RSA -keysize 2048 -validity 9125 -storepass sathi-temp \
              -dname "CN=Sathi Demo, O=uPay" >/dev/null 2>&1
          fi

      - name: Build Android Release APK
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'sathi-temp' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'sathi' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p apk-output
          VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'snapshot' }}"
          cp web/android/app/build/outputs/apk/release/app-release*.apk "apk-output/sathi-${VERSION}.apk"
          ls -la apk-output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sathi-android-apk
          path: apk-output/sathi-*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        # Versioned releases only — every push to main still uploads the
        # workflow artifact; cut a release by pushing a v* tag.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sathi Release ${{ github.ref_name }}
          files: apk-output/sathi-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
