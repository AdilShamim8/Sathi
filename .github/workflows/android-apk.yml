name: Build Android APK & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Next.js Static Export & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Next.js Static Export (web/out)
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://sathi-api.onrender.com' }}
        run: |
          cd web
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd web
          npx cap sync android

      - name: Set gradlew executable permission
        run: |
          chmod +x web/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd web/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p apk-output
          cp web/android/app/build/outputs/apk/debug/app-debug.apk apk-output/sathi-v1.0.0-debug.apk
          ls -la apk-output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sathi-android-apk
          path: apk-output/sathi-v1.0.0-debug.apk
          retention-days: 30

      - name: Upload Web Static Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-static-export
          path: web/out/
          retention-days: 14

      - name: Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Sathi Release {0}', github.ref_name) || 'Sathi App Release v1.2.0 (Latest APK)' }}
          files: apk-output/sathi-v1.0.0-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false

