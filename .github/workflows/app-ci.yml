name: App CI & Engine Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: App — Tests, Lint, Type-check, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run full engine + app test suite (83 tests)
        run: bun test tests/sathi-engines.test.ts tests/sathi-ml.test.ts tests/sathi-app.test.ts

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:../db/custom.db

  ml:
    name: ML Pipeline — Python Tests (78) & Data Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      # Python-format URL (the ml pipeline's own SQLite, NOT the Next.js one)
      DATABASE_URL: sqlite:///./data/sathi.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            ml/requirements.txt
            ml/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest suite (expect 78 passed)
        run: pytest -q

      - name: Verify seeded data generation determinism
        run: python -m data_gen.generate --seed 20261003

      - name: Verify offline demo bundle generation
        run: python -m data_gen.demo_bundle
